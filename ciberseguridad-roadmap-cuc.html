<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciberseguridad · Colegio Universitario de Cartago</title>
<style>
:root{--nv:#14306f;--nv2:#1f4aa8;--rd:#d9383a;--ac:#0f9d78;--yl:#b7791f;--tx:#14213d;--mu:#55607f;--ln:#d9deeb;--cy:#1f4aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#f9f7f2,#edf1f9);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg .a{animation:fa 38s ease-in-out infinite alternate;transform-origin:center}#bg .b{animation:fb 46s ease-in-out infinite alternate;transform-origin:center}#bg .c{animation:sp 160s linear infinite;transform-origin:800px 500px}
@keyframes fa{to{transform:translate(-60px,40px) rotate(6deg)}}@keyframes fb{to{transform:translate(50px,-30px) rotate(-8deg)}}@keyframes sp{to{transform:rotate(360deg)}}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:10px 22px 16px}
header{display:flex;align-items:center;gap:12px}header img{height:54px;width:auto;display:block}.lk{font:600 12px/1.35 Georgia,serif;color:var(--nv);letter-spacing:.05em;padding-left:12px;border-left:2px solid var(--rd)}.ilg{height:96px;width:auto;display:block;margin-bottom:10px}
header em{margin-left:auto;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--rd);text-transform:uppercase;font-style:normal}
#rm{background:#ffffffb8;border:1px solid var(--ln);border-radius:16px;box-shadow:0 6px 22px #14306f14;backdrop-filter:blur(6px)}#rm svg{width:100%;height:112px;display:block}
.sg{fill:none;stroke:#14306f2e;stroke-width:3;stroke-linecap:round}.dn{fill:none;stroke:var(--nv);stroke-width:3;stroke-linecap:round}
.nd{cursor:pointer}.nd circle{fill:#fff;stroke:var(--nv);stroke-width:2;transition:.3s}.nd.d circle{fill:var(--nv)}.nd.d .n{fill:#fff}.nd.on circle{fill:var(--rd);stroke:var(--rd)}.nd.on .n{fill:#fff}
.nd .n{fill:var(--nv);font:700 12px system-ui;text-anchor:middle}.nd .l{fill:var(--mu);font:600 11.5px system-ui;text-anchor:middle}.nd.on .l{fill:var(--rd)}
#tv{fill:var(--rd);stroke:#fff;stroke-width:2}
#pn{min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr);background:#fff;border:1px solid var(--ln);border-radius:18px;box-shadow:0 10px 34px #14306f1c;overflow:hidden;animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.sb{background:linear-gradient(170deg,#14306f,#0c1f4d);color:#fff;padding:24px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.sb .tag{color:#ff9aa1}.sb h2{color:#fff;font-size:22px;margin:0}
.seg{display:flex;flex-direction:column;gap:6px}.seg button{display:flex;gap:10px;align-items:center;text-align:left;background:#ffffff12;border:1px solid #ffffff22;color:#d3dcf7;padding:11px 12px;border-radius:10px;cursor:pointer;font:600 14px system-ui;transition:.2s}.seg button i{font:700 11px ui-monospace,monospace;font-style:normal;color:#ff9aa1}.seg button:hover{background:#ffffff22}.seg button.on{background:#fff;color:var(--nv)}.seg button.on i{color:var(--rd)}
.sb .ft{margin-top:auto;display:flex;gap:8px}.sb .bt{flex:1;background:#ffffff14;color:#fff;border-color:#ffffff30}.sb .bt.on{background:var(--rd);border-color:var(--rd)}
.mn{padding:24px 30px;overflow-y:auto;min-width:0}
.tag{font:600 11px ui-monospace,Menlo,monospace;color:var(--rd);letter-spacing:.14em;text-transform:uppercase}
h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--nv)}h1{font-size:clamp(28px,3.6vw,46px);line-height:1.1;margin:8px 0}h2{font-size:clamp(21px,2.3vw,28px);margin:6px 0 10px}
p{color:var(--mu);line-height:1.6;margin:0 0 10px;font-size:15px}b{color:var(--tx)}
.sec{display:none}.sec.on{display:block;animation:fi .4s}.sk{font:700 11px ui-monospace,monospace;letter-spacing:.14em;color:var(--rd);text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ln)}
.sec[data-p="0"]>p:first-of-type{font-size:16.5px;color:var(--tx);line-height:1.65;padding:14px 16px;background:#f2f5fb;border-left:4px solid var(--rd);border-radius:0 12px 12px 0}
ul{list-style:none;padding:0;margin:0 0 12px}li{position:relative;padding:10px 14px 10px 32px;background:#fff;border:1px solid var(--ln);border-radius:10px;margin-bottom:7px;color:var(--mu);font-size:14.5px;line-height:1.55}li:before{content:"";position:absolute;left:13px;top:17px;width:8px;height:8px;border-radius:2px;background:var(--rd)}
.ex{border-left:3px solid var(--rd);padding:2px 12px;margin:0 0 12px;color:var(--mu);font-size:14px}
.cd{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #14306f12}
.cd>.lb:first-child{margin:-14px -14px 12px;padding:9px 14px;background:var(--nv);color:#fff;border-radius:12px 12px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.lb{font-size:11px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-bottom:6px}
.mo{font:700 15px/1.4 ui-monospace,Menlo,monospace;color:var(--nv);word-break:break-all}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bt{background:#fff;color:var(--nv);border:1px solid #b9c3de;padding:8px 14px;border-radius:9px;cursor:pointer;font:600 13.5px system-ui;transition:.2s}.bt:hover{border-color:var(--nv);background:#f2f5fb}.bt.on{background:var(--nv);color:#fff;border-color:var(--nv)}
input,textarea,select{background:#fff;color:var(--tx);border:1px solid #b9c3de;border-radius:9px;padding:8px 10px;font:inherit;font-size:14px}input[type=range],input[type=checkbox]{padding:0;accent-color:var(--rd)}
.tm{background:#0c1a3d;border-radius:10px;padding:12px;font:12.5px/1.65 ui-monospace,Menlo,monospace;color:#7ef0c9;min-height:90px}.tm .x{color:#ff8b94}.tm .y{color:#ffd37a}
.bar{height:10px;background:#e6eaf4;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;transition:.5s}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.g .cd{margin:0;font-size:13px;color:var(--mu)}.g b{display:block;font-size:14px;margin-bottom:3px}
.xc{background:#fff;border:1px solid var(--ln);border-left:4px solid var(--rd);border-radius:10px;padding:13px;font-size:13.5px;color:var(--mu);line-height:1.5;box-shadow:0 3px 10px #14306f10}.xc b{display:block;color:var(--nv);margin-bottom:4px;font-size:14.5px}
.sus mark{background:#d9383a22;border-bottom:2px solid var(--rd);border-radius:3px;padding:0 2px}mark{background:none;color:inherit}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}.bars i{flex:1;background:#1f4aa8;border-radius:3px 3px 0 0;transition:.3s}.bars i.f{background:var(--rd)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--ln);padding:7px 8px;text-align:left;color:var(--mu)}th{color:var(--nv)}.ok{color:var(--ac)}.no{color:var(--yl)}
.wg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}.wg div{text-align:center;font-size:22px;padding:6px 0;background:#e9edf7;border-radius:8px;opacity:.6;transition:.3s}.wg div.wi{opacity:1;background:#fde1e3;box-shadow:0 0 0 2px var(--rd)}
.em{padding:12px;border:1px solid var(--ln);border-radius:10px;background:#f6f8fd;line-height:1.5;margin-bottom:8px}
.chp{display:inline-block;padding:5px 11px;border-radius:20px;border:1px solid #b9c3de;margin:3px;font-size:13px;color:var(--mu);transition:.3s}.chp.h{background:var(--nv);color:#fff;border-color:var(--nv);font-weight:700}
.fi{padding:7px 10px;border-bottom:1px solid var(--ln);font-size:14px;color:var(--mu)}
.intro{grid-column:1/-1;padding:34px 40px;overflow-y:auto}.intro .g{margin:18px 0}.intro .xc{cursor:pointer;transition:.2s}.intro .xc:hover{transform:translateY(-2px);border-left-color:var(--nv)}.intro .xc em{font:700 11px ui-monospace,monospace;color:var(--rd);font-style:normal}

/* Más aire visual */
.mn{padding:36px 46px 44px}.sec p{margin-bottom:20px;line-height:1.85}.sec ul{margin-bottom:26px}.sec li{padding:15px 20px 15px 40px;margin-bottom:13px;line-height:1.75}li:before{left:17px;top:23px}
.sk{margin-bottom:28px;padding-bottom:10px}.sec[data-p="0"]>p:first-of-type{padding:20px 24px;margin-bottom:30px;line-height:1.8}
.cd{margin:24px 0;padding:20px}.cd>.lb:first-child{margin:-20px -20px 18px;padding:10px 20px}.g{gap:18px}.xc{padding:18px 20px;line-height:1.7}.xc b{margin-bottom:8px}
.r{gap:12px;margin:14px 0}.em{padding:16px}.fi{padding:10px 12px}.tm{padding:16px;line-height:1.8}.ex{padding:4px 16px;margin:0 0 18px}
.sec h3{font:700 18px Georgia,"Times New Roman",serif;color:var(--nv);margin:38px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--ln)}.sec h3:first-child{margin-top:6px}
.fu{margin-top:42px;padding:22px 24px;border:1px dashed #aeb9d8;border-radius:14px;background:#fbfcfe}.fh{font:700 11px ui-monospace,monospace;letter-spacing:.14em;color:var(--rd);text-transform:uppercase;margin-bottom:14px}
.fl{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-top:1px solid var(--ln)}.fl:first-of-type{border-top:0;padding-top:0}.fl a{color:var(--nv2);font-weight:600;font-size:14px;line-height:1.5;text-decoration:underline;text-underline-offset:3px;word-break:break-word}.fl span{font-size:12.5px;color:var(--mu)}
.badge{display:inline-block;background:var(--nv);color:#fff;font:600 12px system-ui;letter-spacing:.08em;padding:7px 16px;border-radius:20px;margin:8px 0 6px}
.intro .g{gap:16px;margin:26px 0}.intro p{margin-bottom:12px}
.box{background:#fff;border:1px solid var(--ln);border-top:4px solid var(--rd);border-radius:14px;padding:28px 32px;box-shadow:0 8px 24px #14306f16}.box .bh{font:700 11px ui-monospace,monospace;letter-spacing:.14em;color:var(--rd);text-transform:uppercase;margin-bottom:16px}.box p{font-size:16px;color:var(--tx);line-height:1.85;margin:0 0 16px}.box p:last-child{margin-bottom:0}.box ul{margin:0 0 16px}.box li{background:none;border:0;padding:5px 0 5px 24px;margin:0;font-size:15.5px;color:var(--tx);line-height:1.7}.box li:before{left:3px;top:14px}
.vc{position:relative;display:block;padding-top:56.25%;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#14306f,#0c1f4d);box-shadow:0 8px 24px #14306f22;text-decoration:none}.vc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}.vc .pl{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:var(--rd);color:#fff;display:grid;place-items:center;font-size:30px;padding-left:5px;box-shadow:0 6px 24px #0008;transition:.2s}.vc:hover .pl{transform:translate(-50%,-50%) scale(1.1)}.vc .vt{position:absolute;left:0;right:0;bottom:0;padding:16px 20px;background:linear-gradient(transparent,#0c1f4dee);color:#fff;font:700 16px system-ui}.vc small{display:block;font-weight:400;font-size:12.5px;color:#c7d3f5;margin-top:3px}
.vw{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#0c1a3d;box-shadow:0 8px 24px #14306f22}.vw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}a.bt{display:inline-block}
.ex2{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;align-items:start}.ill{margin:0;position:sticky;top:0;background:linear-gradient(160deg,#f2f5fb,#fff);border:1px solid var(--ln);border-radius:16px;padding:14px 14px 12px;box-shadow:0 8px 24px #14306f14}.ill svg{width:100%;height:auto;display:block}.ill figcaption{font:600 12.5px/1.4 system-ui;color:var(--mu);text-align:center;margin-top:8px;padding-top:9px;border-top:1px solid var(--ln)}
.ill .fl{animation:flo 3.4s ease-in-out infinite}@keyframes flo{50%{transform:translateY(-6px)}}.ill .pu{animation:pul 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pul{50%{transform:scale(1.18);opacity:.65}}.ill .dl{stroke-dasharray:5 5;animation:dsh 1.5s linear infinite}@keyframes dsh{to{stroke-dashoffset:-20}}.ill .scn2{animation:sc2 3s ease-in-out infinite}@keyframes sc2{0%,100%{transform:translateY(0);opacity:0}15%,85%{opacity:.9}50%{transform:translateY(170px)}}
@media(max-width:1180px){.ex2{grid-template-columns:1fr}.ill{position:static;max-width:300px;margin:6px auto 0;order:-1}}
.stu{margin:16px 0 4px;font-size:16px;color:var(--nv)}.stu b{color:var(--nv)}
@media(max-width:860px){.mn{padding:20px 18px 30px}.box{padding:20px}.sec li{padding:13px 16px 13px 36px}}
@media(max-width:860px){#app{padding:8px 10px 10px}#pn{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.sb{padding:14px;gap:10px}.seg{flex-direction:row}.seg button{flex:1;justify-content:center;padding:9px 4px;font-size:12px}.seg button i{display:none}.sb h2{font-size:18px}.mn{padding:16px}.sb .ft{margin-top:0}}

/* Compacto: que todo quepa en pantalla */
@media(min-width:861px){

.sec p{margin-bottom:10px;line-height:1.65;font-size:14px}

}

.sb{padding:22px 18px;gap:14px}.sb h2{font-size:21px}.seg button{padding:10px 12px;font-size:14px}

}
@media(min-width:861px){.intro{padding:18px 32px}.ilg{height:64px}.intro h1{font-size:30px}.intro p{font-size:15px;margin-bottom:8px}.intro .g{margin:10px 0}}
.intro .g{grid-template-columns:repeat(5,minmax(0,1fr))}.intro .r{justify-content:flex-end}
@media(max-width:860px){.intro .g{grid-template-columns:repeat(2,minmax(0,1fr))}}

const TP=[
{t:'Historia de la ciberseguridad',c:['#0a1a33','#1c3b6b'],g:'01001101 ◉ 10110 ',
b:`<p>La ciberseguridad nació junto a la informática: <b>cada amenaza nueva provocó una defensa nueva</b>. Se pasó de proteger una computadora a proteger redes, nube, dispositivos IoT y enormes volúmenes de datos.</p>
<ul><li><b>Primeros virus y gusanos:</b> programas que se copian solos.</li><li><b>Antivirus:</b> primero buscaban «firmas» de virus conocidos; hoy detectan comportamientos sospechosos.</li><li><b>Hacking y ciberdelito:</b> con Internet y el comercio electrónico llegaron el fraude, el robo de datos y el crimen organizado.</li></ul>
<!--J--><div class="r" id="ek"></div><div class="g"><div class="cd"><b style="color:var(--rd)">⚠ Amenaza</b><span id="ea"></span></div><div class="cd"><b style="color:var(--ac)">🛡 Respuesta o lección</b><span id="ed"></span></div></div>`,
i(){const E=[["1971", "Creeper: primer ejemplo conocido de gusano; se movía por la red ARPANET.", "Se creó Reaper, un programa que lo perseguía y lo eliminaba."], ["1986", "Brain, considerado el primer virus para PC de IBM, se creó para evitar copias ilegales y se propagó por el mundo.", "Antes de Internet, el malware viajaba sobre todo en disquetes."], ["1988", "El gusano Morris se propaga tan rápido que casi paraliza Internet.", "Nace el primer equipo de respuesta ante emergencias informáticas (CERT)."], ["1999", "Melissa se propaga por correo electrónico: un estimado de un millón de cuentas.", "Mostró lo rápido que el malware puede viajar por correo."], ["2000", "ILOVEYOU: correos con adjuntos disfrazados de cartas de amor que aprovechaban la curiosidad.", "Ejemplo clásico de ingeniería social aplicada al malware."], ["2016", "La botnet Mirai usa más de 600.000 dispositivos del hogar mal protegidos para atacar.", "Cambiar contraseñas de fábrica y actualizar el firmware."], ["2017", "WannaCry se propaga por 74 países en el primer día.", "Aplicar el parche de Windows que ya existía."], ["2022", "Conti ataca a Hacienda y a decenas de instituciones de Costa Rica.", "Estado de emergencia nacional y cooperación internacional (asistencia de EE. UU.)."]];
E.forEach((e,k)=>{const b=document.createElement('button');b.className='bt';b.textContent=e[0];b.onclick=()=>{$$('#ek .bt').forEach(x=>x.classList.toggle('on',x==b));$('#ea').textContent=e[1];$('#ed').textContent=e[2]};$('#ek').appendChild(b)});$('#ek .bt').click()}},

{t:'Ingeniería social',c:['#1a0b2e','#43196b'],g:'🧠 ? ! 🧠 ? ! ',
b:`<p><b>Ingeniería social:</b> manipular psicológicamente a las personas para que entreguen información o hagan algo que compromete la seguridad. Es más fácil engañar a una persona que vulnerar un sistema: <b>muchas veces el usuario es el objetivo, no la computadora</b>.</p>
<ul><li><b>Pretexting:</b> inventar una historia creíble.</li><li><b>Baiting:</b> dejar un «cebo» (una memoria USB, una descarga gratis).</li><li><b>Quid pro quo:</b> ofrecer un favor a cambio de información.</li><li><b>Impersonación:</b> hacerse pasar por alguien de confianza.</li></ul>
<p>Palancas emocionales: <b>confianza, urgencia, miedo y curiosidad</b>.</p>
<!--J--><div class="g"><div class="xc"><b>Fraude del CEO</b>Los ciberdelincuentes suplantan a un directivo o a un miembro de la empresa para conseguir su objetivo, como un pago o datos.</div><div class="xc"><b>Vishing</b>Estafa por teléfono: en una llamada se suplanta a una empresa, organización o persona de confianza para obtener información personal y sensible.</div><div class="xc"><b>El «programa legítimo»</b>Nadie instalaría un programa con virus si no creyera que es legítimo: ahí actúa la ingeniería social.</div><div class="xc"><b>ILOVEYOU (2000)</b>Correos con adjuntos disfrazados de cartas de amor: el autor se aprovechó de la curiosidad de las personas.</div></div><p style="margin:22px 0 6px;color:var(--nv);font-weight:700">Técnicas y situaciones cotidianas</p><div class="r" id="sk"></div><div class="cd" id="sb" style="line-height:1.6"></div>`,
i(){const S=[['Pretexting','Llaman diciendo ser «del banco» y piden tu cédula y el código que te llegó por una supuesta compra sospechosa.','Miedo y confianza','Cuelga y llama tú al número oficial.'],['Baiting','En el parqueo aparece una memoria USB con la etiqueta «Planilla 2025».','Curiosidad','Nunca conectes dispositivos desconocidos.'],['Quid pro quo','Alguien ofrece «arreglarte la computadora gratis» a cambio de tu contraseña.','Confianza y beneficio','Solo acepta ayuda de personal autorizado; nunca compartas contraseñas.'],['Impersonación','Una persona con chaleco y credencial falsa pide entrar al cuarto de servidores.','Autoridad y urgencia','Verifica su identidad con quien corresponde antes de dejarla pasar.']];
S.forEach(s=>{const b=document.createElement('button');b.className='bt';b.textContent=s[0];b.onclick=()=>{$$('#sk .bt').forEach(x=>x.classList.toggle('on',x==b));$('#sb').innerHTML='<b>Ejemplo cotidiano:</b> '+s[1]+'<br><b>Palanca:</b> '+s[2]+'<br><b style="color:var(--ac)">Defensa:</b> '+s[3]};$('#sk').appendChild(b)});$('#sk .bt').click()}},

{t:'Phishing, spear phishing y smishing',c:['#2b1608','#6b2d0b'],g:'✉ @ 📧 ✉ @ 📧 ',
b:`<ul><li><b>Phishing:</b> mensajes fraudulentos enviados de forma masiva.</li><li><b>Spear phishing:</b> ataque dirigido a una persona u organización específica, más personalizado y creíble.</li><li><b>Smishing:</b> phishing por SMS o mensajería móvil.</li></ul>
<p><b>Cómo detectarlos:</b> revisa el remitente y el dominio, no abras enlaces ni adjuntos inesperados, desconfía de la urgencia y los errores, y confirma por otro canal.</p><!--J--><div class="g"><div class="xc"><b>Correo falso de «Equipo de cuentas de Microsoft»</b>INCIBE detectó una campaña que, con el pretexto de cancelar la cuenta por ignorar mensajes de actualización, llevaba a una página que imitaba Outlook Web App para robar usuario y contraseña.</div><div class="xc"><b>SMS que suplanta a Correos</b>Campaña de SMS que dirigía a una página web falsa para robar datos personales e información bancaria; la página incluía un captcha para dar sensación de legitimidad.</div></div><p style="margin:22px 0 6px;color:var(--nv);font-weight:700">Compara los tres tipos</p><div class="r"><button class="bt on" data-v="0">Phishing</button><button class="bt" data-v="1">Spear phishing</button><button class="bt" data-v="2">Smishing</button><label><input type="checkbox" id="hl"> Resaltar señales sospechosas</label></div>
<div class="cd" id="ph" style="line-height:1.7"></div><div id="pl" class="ex"></div>
`,
i(){const M=[['<b>De:</b> <mark>soporte@banco-segur0.com</mark><br><b>Asunto:</b> <mark>⚠ Su cuenta será suspendida</mark><br>Estimado cliente: verifique sus datos <mark>en las próximas 24 horas</mark> en <mark>http://banco-segur0.com/login</mark>','Dominio con «0» en vez de «o», saludo genérico, urgencia y enlace falso.'],['<b>De:</b> <mark>marco.finanzas@empresa-corp.co</mark><br>Hola Laura, soy Marco. Adjunto <mark>la factura que me pediste ayer en la reunión de presupuesto</mark>. <mark>Necesito el pago hoy</mark>.','Usa datos reales de Laura (personalizado), dominio casi igual al de la empresa y presión de tiempo.'],['<b>SMS:</b> Correos: su paquete está retenido. <mark>Pague ₡1.200 de aduana</mark> en <mark>bit.ly/3xT-envio</mark>','Enlace acortado, cobro pequeño que parece inofensivo y mensaje inesperado.']];
const u=v=>{$('#ph').innerHTML=M[v][0];$('#pl').innerHTML='<b>Señales:</b> '+M[v][1]};tabs('[data-v]',u);$('#hl').onchange=()=>$('#ph').classList.toggle('sus',$('#hl').checked)}},

{t:'Malware, ransomware y spyware',c:['#240608','#4a1220'],g:'☠ 0x00 ☠ 0xFF ',
b:`<p><b>Malware:</b> software malicioso creado para dañar, espiar o secuestrar sistemas.</p><ul><li><b>Virus:</b> se adjunta a archivos y se propaga al ejecutarlos.</li><li><b>Gusanos:</b> se copian solos por la red.</li><li><b>Troyanos:</b> se disfrazan de programas legítimos.</li><li><b>Ransomware:</b> bloquea o cifra la información y exige un rescate; paraliza empresas, hospitales y gobiernos. Su mejor defensa son los <b>respaldos fuera de línea</b>.</li><li><b>Spyware:</b> recopila información sin autorización (credenciales, hábitos, mensajes) y amenaza la privacidad.</li></ul><p><b>Prevención:</b> actualizar el sistema, usar antivirus, no abrir adjuntos dudosos, descargar solo de fuentes oficiales y mantener respaldos.</p><!--J--><div class="g"><div class="xc"><b>Virus</b>Un archivo adjunto .exe en un correo: al abrirlo se copia a otros archivos.</div><div class="xc"><b>Gusano</b>WannaCry (2017) se propagó solo por redes, sin que nadie abriera nada.</div><div class="xc"><b>Troyano</b>Un «crack» de un videojuego que además instala un programa espía.</div><div class="xc"><b>Ransomware</b>Conti (2022) cifró sistemas de instituciones costarricenses y exigió un rescate.</div><div class="xc"><b>Spyware</b>Una app «gratis» que pide acceso a mensajes, contactos y ubicación sin necesitarlos.</div></div><!--S--><div class="cd"><div class="lb">Simulación: ataque de ransomware</div><div class="r"><button class="bt on" id="rs1">▶ Simular ataque</button><label><input type="checkbox" id="bk"> Respaldo fuera de línea</label></div><div class="bar"><i id="rp"></i></div><div class="tm" id="rt1" style="margin-top:8px">&gt; sistema estable_</div></div><div class="cd"><div class="lb">Simulación: infección por spyware</div><button class="bt on" id="sp">▶ Simular infección</button><div class="tm" id="st1" style="margin-top:8px">&gt; equipo limpio_</div></div>`,
i(){
$('#rs1').onclick=()=>{const bk=$('#bk').checked,P=$('#rp'),T=$('#rt1');tms.forEach(clearTimeout);tms=[];T.innerHTML='';P.style.width='0';const S=[['&gt; un usuario abre un adjunto sospechoso',20,0],['&gt; el malware se propaga por la red',50,0],['&gt; cifrando archivos... 100%',100,1],['<span class="x">&gt; ⚠ ARCHIVOS CIFRADOS. Exigen un rescate</span>',100,1],bk?['&gt; ✔ se restaura el respaldo fuera de línea',50,0]:['<span class="x">&gt; ✖ sin respaldo: la operación se detiene</span>',100,1],bk?['&gt; ✔ servicios recuperados sin pagar',0,0]:['&gt; Lección: respaldos + parches + capacitación',100,1]];S.forEach((x,k)=>tms.push(setTimeout(()=>{T.innerHTML+=x[0]+'<br>';P.style.width=x[1]+'%';P.style.background=x[2]?'var(--rd)':'var(--ac)'},k*900)))};
$('#sp').onclick=()=>play(['&gt; programa «gratis» instalado por el usuario','&gt; spyware oculto en segundo plano...','<span class="y">&gt; registra: contraseñas, mensajes, ubicación</span>','<span class="x">&gt; envía los datos al atacante cada 10 min</span>','&gt; el usuario no nota nada: <span class="x">privacidad comprometida</span>'],$('#st1'),900)}},

{t:'Cifrado y protección de datos',c:['#06191f','#0b4a52'],g:'🔐 SHA 1010 🔐 ',
b:`<p><b>Cifrado:</b> convierte la información en algo ilegible que solo se recupera con la clave correcta.</p>
<ul><li><b>Simétrico:</b> una sola clave (ej. AES); rápido, ideal para muchos datos.</li><li><b>Asimétrico:</b> clave pública y privada; permite comunicarse sin compartir un secreto.</li><li><b>Hashing (ej. SHA-256):</b> genera una «huella» única del dato; no se puede revertir y sirve para verificar integridad.</li><li><b>En reposo:</b> datos guardados (discos, bases de datos). <b>En tránsito:</b> datos que viajan por la red (HTTPS/TLS).</li></ul>
<p><b>Conexión con Big Data:</b> para proteger millones de registros se cifran las bases de datos, se limita con control de acceso quién puede verlas y se protege la transmisión con TLS.</p><!--J--><div class="g"><div class="xc"><b>WhatsApp</b>Cifrado de extremo a extremo: solo quien envía y quien recibe puede leer el mensaje.</div><div class="xc"><b>El candado HTTPS del banco</b>Datos en tránsito cifrados con TLS mientras viajan por Internet.</div><div class="xc"><b>Celular o disco cifrado</b>Datos en reposo: si pierdes el equipo, la información sigue ilegible.</div><div class="xc"><b>Contraseñas como hash</b>El sitio no guarda tu clave real, solo su huella; así una filtración expone menos.</div></div><!--S--><div class="cd"><div class="lb">Simulación: huella SHA-256 del texto</div><input id="hi" value="Transferencia: ₡50.000" style="width:100%"><div class="mo" id="ho" style="margin-top:8px"></div><span id="hd" style="font-size:13px;color:var(--mu)"></span></div>
`,
i(){let prev='';const f=async()=>{const v=$('#hi').value;let h;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){h='(SHA-256 no disponible en este navegador)'}$('#ho').textContent=h;if(prev&&h.length==64&&prev!=h){let d=0;for(let k=0;k<64;k++)if(h[k]!=prev[k])d++;$('#hd').textContent='Cambió '+d+' de 64 caracteres: un detalle mínimo altera toda la huella.'}else $('#hd').textContent='';prev=h.length==64?h:prev};$('#hi').oninput=f;f()}},

{t:'Seguridad en la nube',c:['#0b1e33','#145a8c'],g:'☁ ☁ ⬆ ☁ ☁ ',
b:`<p><b>Nube:</b> usar servidores, almacenamiento y programas de un proveedor por Internet (archivos, bases de datos, plataformas empresariales).</p>
<ul><li><b>Riesgos:</b> filtraciones, contraseñas débiles, configuraciones incorrectas y permisos excesivos.</li><li><b>Buenas prácticas:</b> autenticación multifactor, permisos mínimos y copias de seguridad.</li></ul>
<p><b>Responsabilidad compartida:</b> el proveedor protege la infraestructura; <b>el usuario protege sus datos y accesos</b>.</p>
<!--J--><p>Ejemplos por modelo: <b>IaaS</b> = servidores virtuales; <b>PaaS</b> = plataforma para desarrollar aplicaciones; <b>SaaS</b> = correo o almacenamiento de archivos ya listos para usar.</p><div class="r"><button class="bt on" data-v="0">IaaS (servidores)</button><button class="bt" data-v="1">PaaS (plataforma)</button><button class="bt" data-v="2">SaaS (aplicación lista)</button></div>
<div class="cd"><table id="tb"></table></div>
<!--S--><div class="cd"><div class="lb">Simulación: almacenamiento en la nube</div><div class="r"><b>Almacenamiento de clientes:</b><button class="bt on" id="bu">🔒 Privado</button></div><div class="tm" id="bo" style="min-height:44px"></div></div>`,

{t:'Deepfakes y manipulación digital',c:['#1f0a24','#521a5c'],g:'🎭 ▒ ▓ 🎭 ',
b:`<p><b>Deepfake:</b> imagen, audio o video falso creado con IA generativa que imita a una persona real.</p>
<ul><li><b>Suplantación y fraudes con voz:</b> clonan la voz de un jefe o familiar para pedir dinero.</li><li><b>Desinformación:</b> videos falsos de figuras públicas.</li><li><b>Riesgos:</b> pérdidas económicas y daño reputacional para empresas y personas.</li></ul>
<p><b>Cómo verificar:</b> busca la fuente original, desconfía de la urgencia, observa parpadeo, labios y sombras, y confirma por otro canal.</p>
<!--J--><div class="g"><div class="xc"><b>Estafa por voz</b>Una llamada con la voz clonada de un familiar o jefe pide dinero urgente.</div><div class="xc"><b>Llamada con voz clonada</b>En 2020, un empleado de una empresa en Emiratos Árabes Unidos transfirió 35 millones de dólares tras una llamada que imitaba la voz de su director (caso citado por ESET).</div><div class="xc"><b>Desinformación</b>Un video de una figura pública diciendo algo que nunca dijo, difundido en redes.</div></div><!--S--><div class="cd"><div class="lb" id="dq"></div><div id="ds" style="line-height:1.6;margin-bottom:8px"></div><div class="r"><button class="bt" id="d1">✔ Real</button><button class="bt" id="d2">⚠ Manipulado</button></div><div id="dr" style="min-height:40px;line-height:1.5"></div><button class="bt" id="dn2">Siguiente caso ›</button></div>`,

{t:'Ciberseguridad en IoT',c:['#04201a','#0b4a3a'],g:'📡 IoT 📷 📡 ',

<p><b>¿Qué pasa si un dispositivo cotidiano es la puerta de entrada a una red?</b> Una cámara vulnerable puede dar acceso a todo lo demás.</p><!--J--><div class="g"><div class="xc"><b>Cámara</b>Con la clave «admin», cualquiera puede ver las imágenes.</div><div class="xc"><b>Smart TV</b>Sin actualizaciones queda con fallas conocidas que se pueden explotar.</div><div class="xc"><b>Reloj inteligente</b>Guarda ubicación y salud; si se filtra, expone tu rutina.</div><div class="xc"><b>Sensor industrial o vehículo</b>Mal configurado, puede ser la puerta a una red crítica.</div></div><!--S--><div class="cd"><div class="lb">Simulación: dispositivos de una casa (toca cada uno para cambiar su estado)</div><div class="g" id="dv"></div><div class="tm" id="io" style="margin-top:10px"></div></div>
`,

function IMG(j){const a=SC[j],n=a.length,w=400/n;let s='<svg class="im" viewBox="0 0 400 150" role="img">';a.forEach((e,i)=>{const x=(i+.5)*w;if(i)s+=`<line x1="${x-w+28}" x2="${x-28}" y1="68" y2="68"/>`;s+=`<circle cx="${x}" cy="68" r="32" fill="#4fd0ff14" stroke="#4fd0ff44"/><text class="e" x="${x}" y="80" font-size="36" text-anchor="middle" style="animation-delay:${i*.35}s">${e[0]}</text><text x="${x}" y="127" font-size="11" text-anchor="middle" fill="#bfe0ff">${e[1]}</text>`});return s+'</svg>'}
function worm(g,b,c,m,em,cl,sp,sq){const G=$(g);G.innerHTML='';const C=[];for(let k=0;k<24;k++){const d=document.createElement('div');d.textContent=em;C.push(d);G.appendChild(d)}let st=Array(24).fill(0),t,go=0;
const nb=k=>[k-1,k+1,k-6,k+6].filter(x=>x>=0&&x<24&&!(k%6==0&&x==k-1)&&!(k%6==5&&x==k+1));
const r=()=>{C.forEach((d,k)=>d.className=st[k]?'wi':'');const n=st.filter(x=>x).length;$(m).innerHTML='<b>'+n+' de 24 equipos infectados.</b> '+(go&&!n?'El gusano fue contenido ✔':'')};
$(b).onclick=()=>{clearInterval(t);st=Array(24).fill(0);st[0]=1;go=1;r();t=setInterval(()=>{if(!$(c)){clearInterval(t);return}const p=$(c).checked,s2=st.slice();st.forEach((v,k)=>{if(v){if(p&&Math.random()<cl)s2[k]=0;nb(k).forEach(x=>{if(Math.random()<(p?sq:sp))s2[x]=1})}});st=s2;r();if(!st.some(x=>x)||st.every(x=>x))clearInterval(t)},600)};r()}

{e:'<p>Para entender la ciberseguridad hay que mirar su historia: <b>amenazas y defensas evolucionaron juntas</b>. En 1971 Creeper apareció como un experimento; en 1988 el gusano Morris saturó una parte de Internet y se creó el CERT, el primer equipo de respuesta a incidentes. Con la web llegaron los fraudes, y con la nube y los dispositivos IoT la superficie de ataque se multiplicó.</p>',
x:'<!--S--><div class="cd"><div class="lb">Simulación: propagación de un gusano en una red</div><div class="r"><button class="bt on" id="w1b">▶ Soltar gusano</button><label><input type="checkbox" id="w1c"> Parches y antivirus activos</label></div><div class="wg" id="w1"></div><div id="w1m" style="font-size:13px;color:var(--mu)"></div></div>',

{e:'<p>Los atacantes saben que <b>las personas son el eslabón más fácil</b>: no necesitan romper una contraseña si logran que la entregues. Investigan a la víctima (redes sociales, cargo, compañeros), construyen una historia creíble y presionan con emociones: <b>urgencia</b> («hazlo ya»), <b>miedo</b> («bloquearán tu cuenta»), <b>curiosidad</b> («mira esta foto») o <b>confianza</b> («soy de TI»). Pasa en la vida diaria: llamadas del «banco», mensajes de un «familiar» o personas que piden entrar a una oficina.</p>',
x:'<!--S--><div class="cd"><div class="lb">Simulación: llamada de un falso técnico</div><div style="line-height:1.6"><b>📞 «Técnico»:</b> «Hola, soy de soporte de TI. Detectamos un virus en su PC y necesito su contraseña ahora mismo para limpiarlo.»</div><div class="r"><button class="bt" data-c="0">Darle la contraseña</button><button class="bt" data-c="1">Pedir su nombre y llamar yo a TI</button><button class="bt" data-c="2">Colgar sin más</button></div><div id="cr" style="min-height:44px;line-height:1.5"></div></div>',

{e:'<p>El phishing funciona por volumen: se envían miles de mensajes y basta con que algunos caigan. El <b>spear phishing</b> invierte tiempo en investigar a la víctima (nombre, cargo, proveedores) para que el mensaje parezca real; a menudo suplanta a un jefe o proveedor para pedir pagos. El <b>smishing</b> aprovecha que en el celular es difícil revisar un enlace y que la gente confía en los SMS.</p>',

const s=()=>{$('#iq').innerHTML='<b>'+E[k][0]+'</b><br>'+E[k][1];$('#ir').textContent='';done=0};const a=v=>{if(done)return;done=1;const ok=E[k][2]==v;if(ok)sc++;$('#is').textContent='Aciertos: '+sc;$('#ir').innerHTML=(ok?'<b style="color:var(--ac)">Correcto. </b>':'<b style="color:var(--rd)">Incorrecto. </b>')+E[k][3]};$('#i1').onclick=()=>a('l');$('#i2').onclick=()=>a('p');$('#i3').onclick=()=>{k=(k+1)%E.length;s()};s()}},
{e:'<p>El malware llega por adjuntos de correo, descargas de sitios no oficiales, memorias USB y programas «crackeados». Los <b>virus</b> necesitan que ejecutes un archivo; los <b>gusanos</b> se mueven solos por la red; los <b>troyanos</b> engañan al usuario; el <b>ransomware</b> secuestra datos y a veces los roba para chantajear; el <b>spyware</b> vigila en silencio. Antivirus actualizado, parches y respaldos reducen mucho el daño.</p>',
x:'<div class="cd"><div class="lb">Simulación: escáner de antivirus</div><div id="fl"></div><div class="r"><button class="bt on" id="sc1">▶ Escanear equipo</button><span id="sm" style="color:var(--yl)"></span></div></div>',
j(){const F=[['📊 informe_ventas.xlsx',0],['🧾 factura_urgente.pdf.exe',1],['🎮 juego_crack.exe',1],['🖼️ foto_vacaciones.jpg',0],['⚙️ actualizacion_falsa.scr',1]];const L=$('#fl');L.innerHTML=F.map(x=>'<div class="fi">'+x[0]+' <span></span></div>').join('');$('#sc1').onclick=()=>{tms.forEach(clearTimeout);tms=[];let n=0;$('#sm').textContent='';[...L.children].forEach(d=>d.lastChild.textContent='');F.forEach((x,k)=>tms.push(setTimeout(()=>{L.children[k].lastChild.innerHTML=x[1]?'<b class="x" style="color:var(--rd)">⚠ amenaza</b>':'<b style="color:var(--ac)">✔ limpio</b>';if(x[1])n++;if(k==F.length-1)$('#sm').textContent=n+' amenazas puestas en cuarentena'},(k+1)*700)))}}},
{e:'<p>El cifrado protege los datos en dos momentos: <b>en reposo</b> (guardados en un disco o base de datos) y <b>en tránsito</b> (viajando por la red con HTTPS/TLS). El hashing no cifra: <b>verifica</b>; si el archivo cambia, la huella cambia. Junto con el control de acceso (quién puede ver qué) y contraseñas fuertes, protege desde un celular hasta millones de registros de clientes.</p>',
x:'<div class="cd"><div class="lb">Simulación: tiempo para adivinar una contraseña (10 mil millones de intentos por segundo)</div><input id="pk" value="gato2024" style="width:100%"><div class="bar" style="margin:8px 0"><i id="pkb"></i></div><div id="pkt" style="font-weight:700"></div></div>',

const BOX=["<p>La historia de la ciberseguridad avanza junto con la del malware. En <b>1971</b> apareció <b>Creeper</b>, un experimento que se movía por la red ARPANET; para eliminarlo se creó <b>Reaper</b>, considerado el primer antivirus. En los años 80 los virus viajaban en disquetes: <b>Elk Cloner</b> (1982) y <b>Brain</b> (1986), el primer virus para PC de IBM.</p><p>Con Internet todo se aceleró: en <b>1988</b> el gusano Morris casi paralizó la red y dio origen al primer equipo de respuesta ante emergencias informáticas (CERT), y en <b>1999</b> el gusano Melissa se propagó por correo electrónico a un estimado de un millón de cuentas.</p><p>Después llegaron <b>ILOVEYOU</b> (2000), que aprovechó la curiosidad de las personas, y amenazas más sofisticadas como el ransomware y las botnets de dispositivos conectados, como <b>Mirai</b> (2016). La lección: cada amenaza nueva obliga a crear nuevas defensas.</p>", "<p><b>¿Qué es la ingeniería social?</b> Es una técnica usada por los ciberdelincuentes que consiste en <b>engañar o manipular a las personas</b> para conseguir su información personal (como contraseñas y datos bancarios) o para obtener acceso a sus equipos e instalar malware. Se engaña a la persona, no al sistema.</p><p><b>¿Por qué se usa?</b> Porque es más fácil y barato convencer a alguien de que revele su contraseña que vulnerar sistemas de seguridad complejos. Los atacantes apelan a la vanidad, la avaricia, la curiosidad, el altruismo o el respeto y el temor a la autoridad. Por eso este tipo de ataque no puede frenarse solo con antivirus o cortafuegos.</p><p><b>¿Cómo protegerse?</b> No existe una solución mágica: la mejor defensa es el sentido común, mantenerse informado sobre las técnicas nuevas y formar y concienciar a las personas de la organización.</p>", "<p><b>Phishing:</b> técnica en la que los ciberdelincuentes envían correos que suplantan la identidad de una entidad (un banco, una red social, una entidad pública o un servicio conocido) para obtener información personal y bancaria (usuarios, contraseñas, datos de tarjetas), realizar un cargo económico o infectar el dispositivo.</p><ul><li><b>Spear phishing:</b> variante dirigida a una persona u organización específica, con un mensaje personalizado.</li><li><b>Smishing:</b> el engaño llega por mensajes SMS o de mensajería. También puede llegar por redes sociales y por llamadas (vishing).</li></ul><p><b>Cómo detectarlo:</b> direcciones de correo sospechosas, saludos genéricos, lenguaje urgente o amenazante y solicitudes de hacer clic en vínculos desconocidos.</p><p><b>Si recibes uno:</b> ignora y elimina el mensaje, no hagas clic en enlaces ni descargues adjuntos, y activa la verificación en dos pasos en tus cuentas.</p>", "<p><b>Malware:</b> software malicioso diseñado para dañar, alterar o tomar el control de dispositivos y datos.</p><ul><li><b>Virus:</b> se adjunta a un archivo y necesita una acción del usuario para activarse.</li><li><b>Gusano:</b> se propaga solo por la red.</li><li><b>Troyano:</b> se disfraza de programa legítimo.</li><li><b>Spyware:</b> recopila información sin que el usuario lo sepa.</li><li><b>Ransomware:</b> bloquea el acceso a los datos críticos, los destruye o los publica a menos que se pague un rescate.</li></ul><p>El ransomware puede ser <b>criptográfico</b> (cifra los archivos) o de <b>bloqueo</b> (bloquea el dispositivo). En la <b>doble extorsión</b> además se roban datos y se amenaza con publicarlos. Muchas organizaciones perdieron sus archivos incluso después de pagar el rescate.</p><p>INTERPOL informó que en 2023 los ataques de ransomware aumentaron, en promedio, un 70 % a escala mundial.</p>", "<p><b>Cifrado:</b> transformar los datos para que solo puedan leerlos quienes tienen la clave correcta.</p><ul><li><b>Simétrico:</b> una misma clave cifra y descifra; es más rápido y se usa para grandes cantidades de datos. AES, el estándar más utilizado, fue establecido en 2001 por el NIST.</li><li><b>Asimétrico:</b> un par de claves, pública y privada; es más lento. RSA es el más común.</li><li><b>En reposo:</b> protege los datos almacenados. <b>En tránsito:</b> protege los datos que viajan por la red; al visitar el sitio seguro de un banco, el navegador y el servidor usan cifrado en tránsito.</li></ul><p>El <b>hash</b> no cifra: genera una huella de longitud fija que sirve para comprobar que los datos no cambiaron.</p><p>El cifrado, por sí solo, no basta: también importan la gestión de las claves y el control de acceso.</p>", "<p>En la nube la seguridad es <b>compartida</b>. El proveedor siempre es responsable de la red y la infraestructura subyacentes, y el cliente siempre es responsable de sus <b>datos</b> y de sus <b>políticas de acceso</b>.</p><p>El resto cambia según el servicio: en <b>IaaS</b> el cliente se encarga de más controles; en <b>PaaS</b>, de menos; y en <b>SaaS</b> la mayor parte de las responsabilidades de seguridad las asume el proveedor.</p><p>Por eso guardar información en la nube no significa que el proveedor lo proteja todo: hay que definir quién accede, cómo se configuran los servicios y qué datos se suben.</p>", "<p><b>Deepfake:</b> contenido audiovisual (imágenes, video o audio) generado o modificado con inteligencia artificial para simular que una persona dijo, hizo o protagonizó algo que nunca ocurrió. Incluye la clonación de voz, los rostros inexistentes y la suplantación de identidad.</p><p><b>Riesgos:</b> en lo político y social, la desinformación; en lo económico, el fraude. Hoy basta con unos segundos de grabación para replicar una voz y hacerse pasar por directivos, familiares o proveedores. En 2020, un empleado en Emiratos Árabes Unidos transfirió 35 millones de dólares tras una llamada con la voz de su director.</p><p><b>Defensa:</b> verificar las solicitudes sensibles por otro canal, desconfiar de voces con sonido robótico y combinar personas, procesos y tecnología. La Unión Europea ya exige transparencia para ciertos contenidos generados con IA.</p>", "<p><b>IoT (Internet de las Cosas):</b> objetos cotidianos conectados a Internet, como cámaras de seguridad, routers, electrodomésticos y sensores. Según INCIBE, sus vulnerabilidades más comunes son:</p><ul><li><b>Contraseñas débiles o de fábrica,</b> a veces iguales en todos los dispositivos o incluso públicas; es una de las más graves.</li><li><b>Falta de mecanismos de actualización seguros</b> del firmware.</li><li><b>Configuraciones por defecto inseguras.</b></li></ul><p>En <b>2016</b>, la botnet <b>Mirai</b> infectó más de 600.000 dispositivos del hogar mal protegidos y los usó para ataques de denegación de servicio, uno de ellos superó 1,1 terabits por segundo.</p><p><b>Recomendaciones:</b> tratar a los dispositivos IoT como a una computadora, cambiar de inmediato la contraseña predeterminada, revisar los parches y desactivar los protocolos que no se usan.</p>", "<p>Estudiar casos reales permite ver qué falló y qué se aprendió.</p><p><b>Costa Rica, 2022:</b> el grupo <b>Conti</b> tomó el control de las plataformas TIC@ y ATV del Ministerio de Hacienda el 18 de abril y alcanzó a decenas de instituciones. El 8 de mayo se decretó emergencia nacional. Se le describe como el ciberataque más fuerte contra entidades del Estado costarricense; la CCSS fue atacada por otra organización criminal.</p><p><b>WannaCry, 2017:</b> se propagó por 74 países en el primer día aprovechando una falla de Windows para la que ya existía un parche.</p><p><b>Respuesta internacional:</b> la operación <b>Synergia III</b>, coordinada por INTERPOL con 72 países (julio de 2025 a enero de 2026), cerró más de 45 000 direcciones IP y servidores maliciosos y llevó a 94 detenciones.</p>"],FUN=[[["La historia del malware (versión en inglés)", "IBM Think", "https://www.ibm.com/think/topics/malware-history"], ["50 años de ciberseguridad (Creeper, Reaper y el gusano Morris)", "Rockwell Automation", "https://rockwellautomation.com/es-pr/company/news/blogs/50-years-of-cybersecurity.html"], ["Historia del malware", "KeepCoding", "https://keepcoding.io/blog/historia-del-malware/"]], [["Ingeniería social: que no te engañen", "INCIBE, Gobierno de España", "https://www.incibe.es/ciudadania/blog/sabias-que-los-ataques-de-ingenieria-social-suponen-el-93-de-las-brechas"], ["Ingeniería social: mantente informado y aléjate del engaño", "INCIBE, Gobierno de España", "https://www.incibe.es/empresas/blog/ingenieria-social-mantente-informado-y-alejate-del-engano-protege-tu-empresa"], ["Ingeniería social (fraude del CEO y vishing)", "INCIBE, Gobierno de España", "https://www.incibe.es/empresas/tematicas/ingenieria-social"]], [["¿Qué es el phishing?", "INCIBE, Gobierno de España", "https://www.incibe.es/ciudadania/blog/que-es-el-phishing"], ["¿Qué es el phishing?", "Microsoft Security", "https://www.microsoft.com/es-mx/security/business/security-101/what-is-phishing"], ["Suplantan la identidad de Correos mediante mensajes SMS", "INCIBE, Gobierno de España", "https://www.incibe.es/empresas/avisos/suplantan-identidad-correos-mediante-mensajes-sms"], ["Campaña de correos fraudulentos para robar credenciales", "INCIBE, Gobierno de España", "https://www.incibe.es/empresas/avisos/campana-correos-fraudulentos-intentar-robar-tus-credenciales"]], [["¿Qué es el ransomware?", "Microsoft Security", "https://www.microsoft.com/es-mx/security/business/security-101/what-is-ransomware"], ["Tipos de malware", "Trend Micro", "https://www.trendmicro.com/es_es/what-is/malware/types-of-malware.html"], ["Una operación cibernética de INTERPOL elimina 22 000 direcciones IP maliciosas (operación Synergia II)", "INTERPOL", "https://www.interpol.int/es/Noticias-y-acontecimientos/Noticias/2024/Una-operacion-cibernetica-de-INTERPOL-elimina-22-000-direcciones-IP-maliciosas"]], [["¿Qué es el cifrado de datos?", "Amazon Web Services", "https://aws.amazon.com/es/what-is/data-encryption/"], ["Cifrado de datos", "CrowdStrike", "https://www.crowdstrike.com/es-es/cybersecurity-101/data-protection/data-encryption/"], ["Glosario: encriptación", "Netwrix", "https://netwrix.com/es/cybersecurity-glossary/security-concepts/encryption-glossary/"]], [["Responsabilidad compartida y destino compartido", "Google Cloud", "https://docs.cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate?hl=es-419"]], [["Deepfakes y manipulación digital: el nuevo desafío de la ciberdelincuencia", "UNIR, Universidad Internacional de La Rioja", "https://www.unir.net/revista/ciencias-seguridad/deepfakes-manipulacion-digital/"], ["Alertan sobre llamadas falsas con IA que atacan empresas (advertencia de ESET)", "El Mundo (El Salvador)", "https://diario.elmundo.sv/tecnomundo/alertan-sobre-llamadas-falsas-con-ia-que-atacan-empresas"], ["Recomendaciones para evitar fraudes con deepfakes de voz", "Think Big, Telefónica", "https://blogthinkbig.com/recomendaciones-para-evitar-fraudes-con-deepfakes-de-voz"]], [["La importancia de la seguridad en IoT y sus principales amenazas", "INCIBE-CERT, Gobierno de España", "https://www.incibe.es/incibe-cert/blog/importancia-seguridad-iot-principales-amenazas"], ["¿Pueden nuestros electrodomésticos ser un riesgo a la ciberseguridad? (análisis de ESET)", "El Mundo (Costa Rica)", "https://elmundo.cr/tendencias/pueden-nuestros-electrodomesticos-ser-un-riesgo-a-la-ciberseguridad/"], ["Cómo reducir el riesgo de infección en dispositivos conectados (recomendaciones de Kaspersky)", "Revista E&N", "https://www.revistaeyn.com/tecnologia-cultura-digital/aprenda-como-reducir-el-riesgo-de-infeccion-en-dispositivos-conectados-IE26661009"]], [["Costa Rica bajo ciberataque: vulnerabilidad de sistemas informáticos quedó expuesta en 2022", "Observador.cr", "https://observador.cr/costa-rica-bajo-ciberataque-vulnerabilidad-de-sistemas-informaticos-quedo-expuesta-en-2022/"], ["A un mes del hackeo en Costa Rica, esto es todo lo que debe saber", "La República", "https://www.larepublica.net/noticia/hackers-rusos-tomaron-hacienda-todo-lo-que-debe-saber"], ["Los ataques de ransomware de Conti a Costa Rica: un hecho sin precedentes", "WeLiveSecurity (ESET)", "https://www.welivesecurity.com/la-es/2022/06/23/ataques-ransomware-conti-costa-rica-hecho-sin-precedentes/"], ["Ciberataque masivo golpea 74 países (WannaCry)", "CNN en Español", "https://cnnespanol.cnn.com/2017/05/12/ciberataque-masivo-golpea-74-paises"], ["Cierre de 45 000 direcciones IP maliciosas en una operación internacional (Synergia III)", "INTERPOL", "https://www.interpol.int/es/Noticias-y-acontecimientos/Noticias/2026/Cierre-de-45-000-direcciones-IP-maliciosas-en-una-operacion-internacional-contra-la-ciberdelincuencia"]]];BOX.forEach((m,k)=>{TP[k].bx=m;TP[k].f=FUN[k]});

const _show=show;show=function(j){_show(j);setTimeout(fit,60)};
document.addEventListener('click',()=>setTimeout(fit,40));addEventListener('resize',fit);addEventListener('load',()=>setTimeout(fit,120));setTimeout(fit,200);
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key=='ArrowRight')show(cur+1);if(e.key=='ArrowLeft')show(cur-1);if(e.key=='Escape')intro()});
intro();
</script></body></html>
